services:
  - type: web
    name: rethread-ai
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FAL_KEY
        sync: false
      - key: FAL_ADMIN_KEY
        sync: false
      - key: ANTHROPIC_ADMIN_KEY
        sync: false
      - key: ANTHROPIC_STARTING_CREDIT_USD
        value: "5"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
